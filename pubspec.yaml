name: devoda
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  mapbox_maps_flutter: ^2.25.0
  supabase_flutter: ^2.15.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  pinput: ^6.0.2
  toastification: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  uses-material-design: true

  assets:
    - assets/onboarding/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  remove_alpha_ios: true